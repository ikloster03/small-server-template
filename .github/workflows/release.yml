name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump. Первый релиз всегда 1.0.0 — у changelogen версии 0.x ломают major/minor/patch."
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bump version and update CHANGELOG.md
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail

          case "${BUMP}" in
            patch|minor|major) ;;
            *)
              echo "Unknown bump: ${BUMP}"
              exit 1
              ;;
          esac

          if [ -z "$(git tag --list)" ]; then
            echo "No git tags: first changelogen release is 1.0.0"
            npx --no -- changelogen --bump -r 1.0.0
          else
            npx --no -- changelogen --bump "--${BUMP}"
          fi

      - name: Commit package.json and CHANGELOG.md
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json CHANGELOG.md
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          npx --no -- changelogen gh release "${VERSION}"
