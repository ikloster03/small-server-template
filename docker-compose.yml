# Локальный вариант: один сервис сервера со встроенной SQLite.
#   docker compose up
# Файл базы живёт на томе db-data, переменные сервера — в .env (см. .env.example).
services:
  server:
    build: .
    image: small-server-template
    restart: unless-stopped
    environment:
      PORT: ${PORT:-3000}
      DATABASE_PATH: /data/app.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
    volumes:
      - db-data:/data
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  db-data:
